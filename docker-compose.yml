services:
  postgres:
    image: postgres:17.1-alpine3.20
    container_name: ufitpal
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - ufitpal_network
    volumes:
      - ufitpal_postgres_data:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: meilisearch
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY}
    ports:
      - '${FORWARD_MEILISEARCH_PORT:-7700}:7700'
    volumes:
      - sail-meilisearch:/meili_data
    networks:
      - ufitpal_network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7700/health | grep -q 'available'"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_DEFAULT_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - ufitpal_network

networks:
  ufitpal_network:
    name: ufitpal_network
    driver: bridge

volumes:
  ufitpal_postgres_data:
    name: ufitpal_postgres_data
  ufitpal_ecom_postgres_data:
    name: ufitpal_ecom_postgres_data
  sail-meilisearch:
    name: sail-meilisearch
